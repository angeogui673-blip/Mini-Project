<!doctype html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Catalogue de la bibliothèque{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IM+Fell+French+Canon&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

    <a class="marque" href="{{ url_for('accueil') }}">Catalogue de la bibliothèque</a>

  </main>

</html>
